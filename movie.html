 

<!DOCTYPE html> 

<html> 

<head> 

    <title>Movie Ticket Reservation</title> 

</head> 

 

<body> 

 

<h1>Movie Ticket Reservation</h1> 

 

<form action="BookTicketServlet" method="post"> 

 

    Customer Name: 

    <input type="text" name="customer_name" required> 

    <br><br> 

 

    Movie Name: 

    <input type="text" name="movie_name" required> 

    <br><br> 

 

    Show Date: 

    <input type="date" name="show_date" required> 

    <br><br> 

 

    Show Time: 

    <select name="show_time" required> 

        <option value="10:00 AM">10:00 AM</option> 

        <option value="2:00 PM">2:00 PM</option> 

        <option value="6:00 PM">6:00 PM</option> 

        <option value="9:00 PM">9:00 PM</option> 

    </select> 

    <br><br> 

 

    Number of Seats: 

    <input type="number" name="seats" min="1" required> 

    <br><br> 

 

    Ticket Price: 

    <input type="number" name="ticket_price" value="150" required> 

    <br><br> 

 

    <input type="submit" value="Book Ticket"> 

 

</form> 

 

</body> 

</html>
